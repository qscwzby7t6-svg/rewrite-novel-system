# Docker配置文件

version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novelforge-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/novel.db
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    depends_on:
      - redis
    networks:
      - novelforge-network
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novelforge-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - novelforge-network
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: novelforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - novelforge-network
    restart: unless-stopped

networks:
  novelforge-network:
    driver: bridge

volumes:
  redis-data:
